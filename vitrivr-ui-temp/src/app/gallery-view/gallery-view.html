<div class="gallery-container">
  <div class="gallery-header">
    <div class="criteria-summary">
      <h2>Gallery</h2>
      <p>{{ searchCriteriaSummary }}</p>
    </div>
    <div *ngIf="!loading && images.length > 0" class="image-count">
      <span>{{ images.length }}</span> images found
    </div>
  </div>

  <p-progressSpinner *ngIf="loading"></p-progressSpinner>

  <div *ngIf="!loading && images.length === 0" class="no-results">
    <div class="icon">🖼️</div>
    <h3>No Images Found</h3>
    <p>Your query did not return any images. Try adjusting your search criteria in the query panel.</p>
  </div>

  <div *ngIf="!loading && images.length > 0" class="image-grid">
    <div *ngFor="let image of images" class="image-item">
      <img [src]="image.url" [alt]="image.error ? 'Failed to load image ' + image.id : 'Image ' + image.id" />
      <div class="image-overlay">
        <div class="image-id">ID: {{image.id}}</div>
      </div>
    </div>
  </div>
</div>
