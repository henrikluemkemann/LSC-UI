<div class="gallery-container">
  <div *ngIf="loading" class="loading-overlay">
    <i class="pi pi-images loading-icon"></i>
    <span class="loading-text">Loading images...</span>
  </div>

  <div class="gallery-header" *ngIf="!loading">
    <div class="criteria-summary">
      <h2>Gallery</h2>
      <p>{{ searchCriteriaSummary }}</p>
    </div>
    <div *ngIf="images.length > 0" class="image-count">
      <span>{{ images.length }}</span> images found
    </div>
  </div>

  <div *ngIf="!loading && images.length === 0" class="no-results">
    <div class="icon">🖼️</div>
    <h3>No Images Found</h3>
    <p>Your query did not return any images. Try adjusting your search criteria in the query panel.</p>
  </div>

  <div *ngIf="!loading && images.length > 0" class="image-grid">
    <div *ngFor="let image of images" class="image-item" (click)="onImageClick(image)">
      <img [src]="image.url" [alt]="getAltText(image)" />
      <div class="image-overlay">
        <div class="image-id">ID: {{image.id}}</div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="showHighQuality" class="high-quality-viewer" (click)="closeHighQualityView()">
  <div class="viewer-content" (click)="$event.stopPropagation()">
    <div class="close-button" (click)="closeHighQualityView()">&times;</div>
    <img [src]="highQualityImageUrl" alt="High Quality Image" />
    <div class="viewer-actions">
      <a [href]="highQualityImageUrl" [download]="'high-quality-' + selectedImageId + '.jpg'" class="download-button">Download Image</a>
    </div>
  </div>
</div>
