<p-card header="Query Panel" [style]="{'width': '300px', 'min-width': '280px'}" styleClass="p-shadow-3 p-mr-3 p-flex-shrink-0">
    <div class="p-field p-mb-4">
        <h5>Time Range</h5>
        <p-slider [(ngModel)]="timeRange" [range]="true" [min]="0" [max]="100" (onChange)="onTimeRangeChange()"></p-slider>
        <div class="p-text-center p-text-sm p-text-500" style="margin-top: 1rem;">
            {{timeRange[0]}} - {{timeRange[1]}}
        </div>
    </div>

    <div class="p-field p-mb-4">
        <h5>Geographical Search</h5>
        <p class="p-text-sm p-text-secondary">Choose one search method:</p>

        <div class="search-tabs p-mb-2">
            <div class="tab-header p-d-flex">
                <div class="tab-item p-flex-1" [class.active]="activeTab === 'city'" (click)="setActiveTab('city')">
                    <span>City Search</span>
                </div>
                <div class="tab-item p-flex-1" [class.active]="activeTab === 'circle'" (click)="setActiveTab('circle')">
                    <span>Draw Circle</span>
                </div>
                <div class="tab-item p-flex-1" [class.active]="activeTab === 'box'" (click)="setActiveTab('box')">
                    <span>Draw Box</span>
                </div>
            </div>

            <div class="tab-content p-mt-2" *ngIf="activeTab === 'city'">
                <input type="text" pInputText [(ngModel)]="citySearchTerm"
                       (input)="onCitySearchChange()"
                       placeholder="City (e.g., Dublin)"
                       class="p-inputtext-sm p-w-full" />
                <small class="p-text-secondary">Search by city or location name</small>
            </div>

            <div class="tab-content p-mt-2" *ngIf="activeTab === 'circle'">
                <div class="p-field p-mb-3 p-w-full">
                    <p-selectButton
                            [options]="radiusScaleOptions"
                            [ngModel]="selectedRadiusScale"
                            (onOptionClick)="handleScaleOptionClick($event)"
                            [unselectable]="false">
                    </p-selectButton>
                </div>

                <div class="p-field p-mb-3 p-w-full">
                    <label for="radiusSlider" class="p-d-block">Radius: {{ getFormattedRadius() }}</label>
                    <p-slider *ngIf="showSlider"
                              id="radiusSlider"
                              [(ngModel)]="circleRadius"
                              [min]="radiusSliderConfig.min"
                              [max]="radiusSliderConfig.max"
                              [step]="radiusSliderConfig.step"
                              (onChange)="onRadiusChange()">
                    </p-slider>
                </div>

                <div class="draw-buttons-container">
                    <p-button label="Draw Circle"
                              icon="pi pi-circle-fill"
                              styleClass="p-button-secondary p-button-sm"
                              (onClick)="onDrawCircleClick()"
                              [disabled]="isDrawButtonDisabled">
                    </p-button>

                    <p-button label="Apply Circle"
                              icon="pi pi-check"
                              styleClass="p-button-success p-button-sm"
                              (onClick)="onApplyCircle()"
                              [disabled]="isApplyCircleButtonDisabled">
                    </p-button>
                </div>

                <small class="p-text-secondary d-block p-mt-2">
                    Click "Draw Circle", then select a point on the map.
                </small>
            </div>

            <div class="tab-content p-mt-2" *ngIf="activeTab === 'box'">
                <p-button label="Draw Box"
                          icon="pi pi-stop"
                          styleClass="p-button-secondary p-button-sm p-mb-2 p-w-12"
                          (onClick)="onDrawBoxClick()">
                </p-button>

                <small class="p-text-secondary d-block p-mt-2">
                    Select two points on the map to define the corners of the box.
                </small>
            </div>
        </div>
    </div>

    <div class="apply-search-wrapper">
        <p-button label="Apply Search" icon="pi pi-search"
                  (onClick)="onApplySearch()"
                  styleClass="p-button-success p-button-lg p-w-full"></p-button>
    </div>
</p-card>

<p-toast position="top-left"></p-toast>
