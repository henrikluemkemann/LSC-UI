<app-header (viewChange)="onViewChange($event)" (settingsClick)="toggleSettingsPanel()"></app-header>
<div class="app-content-area">
    <app-query-panel></app-query-panel>
    <app-map-view
            *ngIf="currentView === 'map'"
            [initialMapState]="mapState"
            (mapStateChange)="onMapStateChange($event)">
    </app-map-view>
    <div *ngIf="currentView === 'gallery'" class="gallery-placeholder">
        <div class="gallery-message">Gallery View (Placeholder)</div>
    </div>
</div>

<app-setting-panel *ngIf="isSettingsPanelVisible" (closePanel)="closeSettingsPanel()">
</app-setting-panel>
