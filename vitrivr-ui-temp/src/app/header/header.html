<div class="header-container">
  <div class="header-left">
    <p-button label="Settings" icon="pi pi-cog" styleClass="p-button-text p-button-lg"></p-button>
  </div>

  <div class="header-right">
    <p-selectButton
      [options]="viewOptions"
      [(ngModel)]="selectedView"
      optionLabel="label"
      optionValue="value"
      (onChange)="onViewChange()"
    ></p-selectButton>
  </div>
</div>
